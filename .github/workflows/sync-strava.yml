name: Sync Strava (Zoe)

on:
  workflow_dispatch:          # 手動觸發（已停用自動排程）

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Strava activities
        env:
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_ATHLETE_ID:    ${{ secrets.STRAVA_ATHLETE_ID }}
        run: python scripts/fetch_strava.py data/strava.json

      - name: Commit & push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/strava.json
          git diff --cached --quiet || git commit -m "sync: Zoe Strava $(date -u +%Y-%m-%d)"
          git push
