name: Sync intervals.icu (Zoe)

on:
  workflow_dispatch:          # 手動觸發（已停用自動排程）

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch intervals.icu data
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python scripts/fetch_intervals.py data/strava.json

      - name: Commit & push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/strava.json
          git diff --cached --quiet || git commit -m "sync: Zoe intervals.icu $(date -u +%Y-%m-%d)"
          git push
